services:
  db:
    image: postgres:16-alpine
    container_name: raymond_db
    environment:
      POSTGRES_USER: raymond
      POSTGRES_PASSWORD: raymond123
      POSTGRES_DB: raymond_dev
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
