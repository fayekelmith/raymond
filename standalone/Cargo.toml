[package]
name = "standalone"
version = "0.1.0"
edition = "2021"

[lib]
name = "standalone"
path = "src/lib.rs"
test = true

[[bin]]
name = "standalone"
path = "src/main.rs"
test = false

[dependencies]
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"], optional = true }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"], optional = true }
embassy-rp = { version = "0.9.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040", "boot2-w25q080"], optional = true }

# Graphics / LED Matrix
hub75-pio = { git = "https://github.com/kjagiello/hub75-pio-rs", optional = true }
embedded-graphics = { version = "0.8.1", optional = true }

# Utilities
fastrand = { version = "2.0.1", default-features = false, optional = true }
heapless = "0.8.0"
cortex-m = { version = "0.7.7", features = ["inline-asm"], optional = true }
cortex-m-rt = { version = "0.7.3", optional = true }
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
portable-atomic = { version = "1.11.0", features = ["critical-section"], optional = true }
static_cell = { version = "2.1.1", optional = true }
embassy-sync = { version = "0.7.2", features = ["defmt"], optional = true }

[dev-dependencies]
embedded-graphics = "0.8.1"

[features]
default = ["embedded"]
embedded = [
    "embassy-executor",
    "embassy-time",
    "embassy-rp",
    "embassy-sync",
    "hub75-pio",
    "embedded-graphics",
    "fastrand",
    "cortex-m",
    "cortex-m-rt",
    "defmt",
    "defmt-rtt",
    "panic-probe",
    "portable-atomic",
    "static_cell",
]
embassy-sync = ["dep:embassy-sync"]
